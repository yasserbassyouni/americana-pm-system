<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delete Line</title><link rel="stylesheet" href="settings.css"><style>.line{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px;border:1px solid #ddd;border-radius:10px;margin:10px 0}.danger{background:#8b0000!important;color:#fff}.muted{color:#666;font-size:13px}</style></head><body>
<header class="top"><div class="bar"><div><h2>Delete Production Line</h2><div>Only use this when a line should be permanently removed.</div></div><button class="btn" onclick="location.href='settings.html'">← Settings</button></div></header>
<main class="wrap"><div class="card"><div class="muted">PM creation and updates are done only from <b>Import Annual Excel</b>. This page is only for permanent line deletion.</div><div id="list">Loading…</div></div></main>
<script>
const token=localStorage.getItem('pmToken');if(!token)location.replace('login.html');
async function api(url,opt={}){const h={...(opt.headers||{}),Authorization:'Bearer '+token};if(opt.body&&!h['Content-Type'])h['Content-Type']='application/json';const r=await fetch(url,{...opt,headers:h});let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{const m=await api('/api/pm-master');const lines=m.lines||[];document.getElementById('list').innerHTML=lines.length?lines.map(x=>`<div class="line"><div><b>${esc(x.name)}</b><div class="muted">${(x.machines||[]).length} machine(s)</div></div><button class="btn danger" onclick="del('${encodeURIComponent(x.name)}')">Delete Line Permanently</button></div>`).join(''):'<p>No production lines.</p>'}catch(e){document.getElementById('list').textContent=e.message}}
async function del(v){const line=decodeURIComponent(v);if(!confirm(`Permanently delete ${line} and its PM Excel files?\n\nThis cannot be undone.`))return;const typed=prompt(`Type the line name exactly to confirm:\n${line}`);if(typed!==line)return alert('Line name did not match. Nothing deleted.');try{await api('/api/pm-master/lines/'+encodeURIComponent(line),{method:'DELETE',body:JSON.stringify({mode:'folder'})});alert('Line permanently deleted.');load()}catch(e){alert(e.message)}}load();
</script><script src="i18n.js?v=200"></script></body></html>
