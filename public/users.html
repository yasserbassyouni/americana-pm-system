<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users</title><link rel="stylesheet" href="settings.css">
<style>.editbox{display:none;border:2px solid #b60000}.editbox.show{display:block}.msg{margin-top:10px;font-weight:700}.ok{color:#08783c}.bad{color:#b60000}.pwhelp{font-size:12px;color:#666;margin-top:4px}</style><link rel="stylesheet" href="i18n.css"><link rel="stylesheet" href="workflow-guide.css">
</head><body>
<header class="top"><div class="bar"><h2>Users & Passwords</h2><button class="btn" onclick="location.href='settings.html'">← Settings</button></div></header>
<main class="wrap">
<div class="panel"><h3>Add User</h3><div class="row">
<label>Name<input id="addName"></label><label>Username<input id="addUsername" autocomplete="off"></label><label>Password<input id="addPassword" type="password" autocomplete="new-password"></label><label>Role<select id="addRole"><option>Technician</option><option value="Viewer">Viewer / Review Only</option><option>Admin</option></select></label>
</div><div class="pwhelp"><b>Access Type:</b> Admin = full access; Technician = execute PM; Viewer = review/export only.</div><button class="btn red" style="margin-top:12px" onclick="addUser()">Add User</button><div id="addMsg" class="msg"></div></div>

<div id="editBox" class="panel editbox"><h3>Edit User</h3><input id="editId" type="hidden"><div class="row">
<label>Name<input id="editName"></label><label>Username<input id="editUsername"></label><label>New Password<input id="editPassword" type="password" autocomplete="new-password"><div class="pwhelp">Leave blank to keep the current password.</div></label><label>Role<select id="editRole"><option>Technician</option><option value="Viewer">Viewer / Review Only</option><option>Admin</option></select></label>
</div><div class="actions" style="margin-top:12px"><button class="btn green" onclick="saveEdit()">Save Changes</button><button class="btn gray" onclick="cancelEdit()">Cancel</button></div><div id="editMsg" class="msg"></div></div>

<div class="panel"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Active</th><th>Actions</th></tr></thead><tbody id="tb"></tbody></table></div></main>
<script src="settings-common.js"></script><script>
let userList=[];
const el=id=>document.getElementById(id);
function message(target,text,ok=true){target.textContent=text;target.className='msg '+(ok?'ok':'bad')}
async function load(){
  userList=await api('/api/settings/users');
  el('tb').innerHTML=userList.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.username)}</td><td>${esc(x.role)}</td><td>${x.active!==false?'Yes':'No'}</td><td class="actions"><button class="btn green" onclick="editUser('${x.id}')">Edit</button><button class="btn gray" onclick="toggle('${x.id}',${x.active!==false})">${x.active!==false?'Disable':'Enable'}</button>${x.username!=='admin'?`<button class="btn red" onclick="delu('${x.id}')">Delete</button>`:''}</td></tr>`).join('');
}
async function addUser(){
  const body={name:el('addName').value.trim(),username:el('addUsername').value.trim(),password:el('addPassword').value,role:el('addRole').value};
  if(!body.name||!body.username||!body.password){message(el('addMsg'),'Please enter Name, Username and Password.',false);return}
  try{await api('/api/settings/users',{method:'POST',body:JSON.stringify(body)});el('addName').value='';el('addUsername').value='';el('addPassword').value='';message(el('addMsg'),'User added successfully.');await load()}catch(e){message(el('addMsg'),e.message,false)}
}
function editUser(id){
  const x=userList.find(u=>String(u.id)===String(id)); if(!x)return;
  el('editId').value=x.id;el('editName').value=x.name;el('editUsername').value=x.username;el('editPassword').value='';el('editRole').value=x.role;el('editMsg').textContent='';el('editBox').classList.add('show');el('editBox').scrollIntoView({behavior:'smooth',block:'center'});
}
function cancelEdit(){el('editBox').classList.remove('show')}
async function saveEdit(){
  const id=el('editId').value;const body={name:el('editName').value.trim(),username:el('editUsername').value.trim(),role:el('editRole').value};if(el('editPassword').value)body.password=el('editPassword').value;
  if(!body.name||!body.username){message(el('editMsg'),'Name and Username are required.',false);return}
  try{await api('/api/settings/users/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(body)});message(el('editMsg'),'User updated successfully.');await load();setTimeout(cancelEdit,500)}catch(e){message(el('editMsg'),e.message,false)}
}
async function toggle(id,a){try{await api('/api/settings/users/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({active:!a})});await load()}catch(e){alert(e.message)}}
async function delu(id){if(confirm('Delete user?')){try{await api('/api/settings/users/'+encodeURIComponent(id),{method:'DELETE'});await load()}catch(e){alert(e.message)}}}
load().catch(e=>message(el('addMsg'),e.message,false));
</script><script src="branding-client.js?v=143"></script><script src="i18n.js?v=130"></script>
<script src="workflow-guide.js?v=141"></script></body></html>
