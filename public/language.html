<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Language Settings</title><link rel="stylesheet" href="settings.css"><link rel="stylesheet" href="i18n.css"><link rel="stylesheet" href="workflow-guide.css"></head><body>
<header class="top"><div class="bar"><div><h2>Language Settings</h2><div>Smart PM Maintenance</div></div><button class="btn" onclick="location.href='settings.html'">← Settings</button></div></header>
<main class="wrap"><div class="card" style="max-width:720px;margin:auto"><h3>Interface Language</h3><p>Choose the interface language for this device. The selection is saved in the browser.</p><p>The page direction changes automatically between LTR and RTL.</p><label style="display:block;margin-top:18px">Language<select id="langMain" style="display:block;width:100%;margin-top:7px;padding:11px;border:1px solid #cbd2da;border-radius:9px"></select></label></div></main>
<script src="settings-common.js"></script><script src="i18n.js?v=130"></script><script>document.addEventListener('DOMContentLoaded',()=>{const s=document.getElementById('langMain');const langs=PMI18N.getLanguages();s.innerHTML=Object.entries(langs).map(([code,name])=>`<option value="${code}">${name}</option>`).join('');s.value=PMI18N.getLanguage();s.onchange=()=>PMI18N.setLanguage(s.value)});</script><script src="branding-client.js?v=143"></script><script src="workflow-guide.js?v=141"></script></body></html>
