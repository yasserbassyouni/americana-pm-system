<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit</title><link rel="stylesheet" href="settings.css"><link rel="stylesheet" href="i18n.css"><link rel="stylesheet" href="workflow-guide.css">
</head><body><header class="top"><div class="bar"><h2>Audit Log</h2><button class="btn" onclick="location.href='settings.html'">← Settings</button></div></header><main class="wrap"><div class="panel"><table><thead><tr><th>Date/Time</th><th>User</th><th>Role</th><th>Action</th><th>Details</th></tr></thead><tbody id="tb"></tbody></table></div></main><script src="settings-common.js"></script><script>async function load(){const a=await api('/api/settings/audit');tb.innerHTML=a.map(x=>`<tr><td>${esc(new Date(x.time).toLocaleString())}</td><td>${esc(x.user)}</td><td>${esc(x.role)}</td><td>${esc(x.action)}</td><td><span class="muted">${esc(JSON.stringify(x.details||{}))}</span></td></tr>`).join('')}load();</script><script src="branding-client.js?v=143"></script><script src="i18n.js?v=130"></script>
<script src="workflow-guide.js?v=141"></script></body></html>
