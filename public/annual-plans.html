<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Annual PM Plan</title><link rel="stylesheet" href="settings.css"><link rel="stylesheet" href="i18n.css"><style>
body{background:#f4f7fb}.wrap{max-width:98%;margin:auto}.filters{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 2fr auto;gap:10px;align-items:end}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}.stat{background:#fff;border:1px solid #dbe3ef;border-radius:12px;padding:16px}.stat b{display:block;font-size:27px;color:#163b85;margin-top:6px}.range{padding:12px 16px;background:#eaf3ff;border:1px solid #b9d3fa;border-radius:9px;margin:12px 0}.gridwrap{overflow:auto;max-height:68vh;border:1px solid #d7dfeb;border-radius:10px;background:white}.plan{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12px}.plan th{position:sticky;top:30px;background:#214895;color:white;z-index:3;padding:9px 6px;border-right:1px solid #5876b4}.plan td{padding:7px 6px;border-right:1px solid #d8e0eb;border-bottom:1px solid #d8e0eb;vertical-align:top}.plan th:nth-child(-n+6),.plan td:nth-child(-n+6){position:sticky;z-index:2;background:white}.plan th:nth-child(-n+6){z-index:5;background:#214895}.plan thead tr.month-row th{top:0;height:30px;background:#b80000;color:#fff;text-align:center;font-size:12px}.plan thead tr.month-row th.fixed-month{left:0;z-index:7;text-align:left}.plan thead tr.week-row th{top:30px}.plan th:nth-child(1),.plan td:nth-child(1){left:0;width:110px}.plan th:nth-child(2),.plan td:nth-child(2){left:110px;width:140px}.plan th:nth-child(3),.plan td:nth-child(3){left:250px;width:150px}.plan th:nth-child(4),.plan td:nth-child(4){left:400px;width:260px}.plan th:nth-child(5),.plan td:nth-child(5){left:660px;width:90px}.plan th:nth-child(6),.plan td:nth-child(6){left:750px;width:95px}.wk{text-align:center;min-width:64px;width:64px;max-width:64px}.p,.d,.x{display:inline-block;border-radius:5px;padding:5px 8px;font-weight:800}.p{background:#fff1f1;border:1px solid #e58b8b;color:#b00000}.d{background:#dcfce7;border:1px solid #70c88f;color:#087b38}.x{background:#fff0c9;border:1px solid #e7bd57;color:#9a5b00}.mtype{font-weight:800}.E{color:#1769aa}.M{color:#8a4b08}@media(max-width:1000px){.filters{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}</style></head><body>
<header class="top"><div class="bar"><div><h2>Annual PM Plan</h2><div>Full Year / Monthly / Weekly preventive maintenance plan</div></div><button class="btn" onclick="location.href='index.html'">← Dashboard</button></div></header><main class="wrap"><div class="card">
<div class="filters"><label>Line<select id="line"></select></label><label>Year<select id="year"></select></label><label>Month<select id="month"><option value="0">All Months</option></select></label><label>Week From<select id="from"></select></label><label>Week To<select id="to"></select></label><label>Maintenance Type<select id="mt"><option value="ALL">All</option><option value="E">Electrical (E)</option><option value="M">Mechanical (M)</option></select></label><button class="btn red" id="apply">Apply Filters</button></div><div style="display:flex;gap:10px;justify-content:flex-end;margin:10px 0"><button class="btn" id="printBtn">Print Grid</button><button class="btn red" id="exportBtn">Export Grid CSV</button></div>
<div class="range" id="range">Selected Range: Week 1 - Week 52</div><div class="stats"><div class="stat">Planned<b id="planned">0</b></div><div class="stat">Electrical (E)<b id="ec">0</b></div><div class="stat">Mechanical (M)<b id="mc">0</b></div><div class="stat">PM Tasks<b id="tc">0</b></div><div class="stat">Weeks Selected<b id="wc">52</b></div></div>
<div class="gridwrap"><table class="plan"><thead><tr id="monthHead" class="month-row"></tr><tr id="head" class="week-row"><th>Line</th><th>Machine</th><th>Part</th><th>PM Task</th><th>Frequency</th><th>Type</th></tr></thead><tbody id="body"></tbody></table></div></div></main>
<script src="settings-common.js"></script><script>
(()=>{'use strict';const E=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tasks=[],execMap=new Map();const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
function weekMonth(y,w){const d=new Date(y,0,1,12);while(d.getDay()!==5)d.setDate(d.getDate()+1);d.setDate(d.getDate()+(w-1)*7);return d.getMonth()+1}
function setup(){E('month').innerHTML='<option value="0">All Months</option>'+months.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');E('from').innerHTML=E('to').innerHTML=Array.from({length:52},(_,i)=>`<option value="${i+1}">Week ${i+1}</option>`).join('');E('to').value='52'}
async function init(){setup();const [m,p]=await Promise.all([api('/api/pm-master'),api('/api/year-planner')]);const names=[...(m.lines||[]).filter(x=>x.enabled!==false).map(x=>x.name)];for(const x of p.lines||[])if(x.name&&!names.includes(x.name))names.push(x.name);E('line').innerHTML=names.map(x=>`<option>${esc(x)}</option>`).join('');const y=new Date().getFullYear();E('year').innerHTML=[y-1,y,y+1,y+2].map(x=>`<option>${x}</option>`).join('');E('year').value=String(y);if(names.length)await load()}
async function load(){const line=E('line').value,y=+E('year').value;const d=await api(`/api/task-management?line=${encodeURIComponent(line)}&year=${y}`);tasks=d.tasks||[];execMap=new Map();try{const rr=await api(`/api/management/report?year=${y}&month=0&week=0&line=${encodeURIComponent(line)}&status=ALL`);for(const r of rr.rows||[]){const dt=new Date(y,0,1,12);while(dt.getDay()!==5)dt.setDate(dt.getDate()+1);const wd=new Date(y,r.month-1,1,12);while(wd.getDay()!==5)wd.setDate(wd.getDate()+1);wd.setDate(wd.getDate()+(Number(r.week)-1)*7);const gw=Math.floor((wd-dt)/604800000)+1;execMap.set(String(r.taskId)+'|'+gw,r.status)}}catch(e){}render()}
function render(){const y=+E('year').value,month=+E('month').value,mt=E('mt').value;let a=+E('from').value,b=+E('to').value;if(month){const ww=Array.from({length:52},(_,i)=>i+1).filter(w=>weekMonth(y,w)===month);if(ww.length){a=Math.min(...ww);b=Math.max(...ww);E('from').value=a;E('to').value=b}}if(a>b)[a,b]=[b,a];const weeks=Array.from({length:b-a+1},(_,i)=>a+i);E('range').innerHTML=`Selected Range: <b>Week ${a} - Week ${b}</b>`;E('wc').textContent=weeks.length;E('head').innerHTML='<th>Line</th><th>Machine</th><th>Part</th><th>PM Task</th><th>Frequency</th><th>Type</th>'+weeks.map(w=>`<th class="wk">W${w}</th>`).join('');
const groups=[];for(const w of weeks){const m=weekMonth(y,w);const last=groups[groups.length-1];if(last&&last.m===m)last.n++;else groups.push({m,n:1})}E('monthHead').innerHTML='<th class="fixed-month" colspan="6">Month</th>'+groups.map(g=>`<th colspan="${g.n}">${months[g.m-1]}</th>`).join('');let list=tasks.filter(t=>t.isActive!==false);if(mt!=='ALL')list=list.filter(t=>String(t.maintenanceType||'').toUpperCase()===mt);let planned=0,ec=0,mc=0;E('body').innerHTML=list.map(t=>{const sw=new Set((t.scheduleWeeks||[]).map(Number));const hits=weeks.filter(w=>sw.has(w)).length;planned+=hits;if(t.maintenanceType==='E')ec+=hits;if(t.maintenanceType==='M')mc+=hits;const task=(localStorage.getItem('pmLang')==='ar'&&t.arabicMaintenance)?t.arabicMaintenance:t.maintenance;return `<tr><td>${esc(t.line)}</td><td><b>${esc(t.machineName||t.machineNo)}</b><br><small>${esc(t.machineIdentified||t.machineNo)}</small></td><td>${esc(t.part)}</td><td>${esc(task)}</td><td>${esc(t.frequency)}</td><td class="mtype ${esc(t.maintenanceType)}">${esc(t.maintenanceType||'-')}</td>${weeks.map(w=>{const st=execMap.get(String(t.taskId)+'|'+w);let mark='-';if(sw.has(w)){mark=st==='Done'?'<span class="d">✓</span>':(st==='Deferred'?'<span class="x">D</span>':'<span class="p">P</span>')}return `<td class="wk">${mark}</td>`}).join('')}</tr>`}).join('')||'<tr><td colspan="58">No PM tasks found for this selection.</td></tr>';E('planned').textContent=planned;E('ec').textContent=ec;E('mc').textContent=mc;E('tc').textContent=list.length}
E('apply').onclick=render;E('printBtn').onclick=()=>window.print();E('exportBtn').onclick=()=>{const rows=[...document.querySelectorAll('.plan tr')].map(tr=>[...tr.children].map(c=>'"'+String(c.innerText||'').replaceAll('\"','\"\"')+'"').join(','));const b=new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`Annual_PM_${E('line').value}_${E('year').value}_W${E('from').value}-W${E('to').value}.csv`;a.click();URL.revokeObjectURL(a.href)};E('line').onchange=load;E('year').onchange=load;E('month').onchange=render;init().catch(e=>alert(e.message))})();
</script><script src="branding-client.js"></script><script src="i18n.js"></script></body></html>
