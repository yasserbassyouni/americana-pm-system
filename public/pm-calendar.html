<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PM Calendar</title><link rel="stylesheet" href="settings.css"><link rel="stylesheet" href="i18n.css"><style>
body{background:#f4f7fb}.top{background:#c90000}.wrap{max-width:1450px;margin:22px auto;padding:0 24px}.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.controls label{font-weight:700}.controls select{display:block;margin-top:5px;padding:10px 14px;border:1px solid #ccd5e2;border-radius:8px;background:#fff}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#d9e0ea;border:1px solid #d9e0ea;margin-top:18px}.dow,.day{background:#fff;min-height:120px;padding:12px}.dow{min-height:auto;text-align:center;font-weight:800;background:#c90000;color:#fff}.day.other{background:#f4f6f9;color:#a1a8b3}.num{font-size:18px;font-weight:800}.friday{box-shadow:inset 0 0 0 2px #c90000}.badge{display:inline-block;margin-top:12px;padding:6px 9px;border-radius:15px;background:#fff0f0;color:#b00000;font-weight:800;font-size:12px}.open{display:block;margin-top:9px;color:#c90000;font-weight:800;cursor:pointer}.summary{margin-top:12px;color:#5f6d84}.card{padding:20px}@media(max-width:800px){.day{min-height:90px;padding:7px}.badge{font-size:10px}}
</style></head><body><header class="top"><div class="bar"><div><h2>PM Calendar</h2><div>Monthly preventive maintenance calendar grid</div></div><button class="btn" onclick="location='index.html'">← Dashboard</button></div></header><main class="wrap"><div class="card"><div class="controls"><label>Year<select id="year"></select></label><label>Month<select id="month"></select></label><button class="btn red" id="today">Current Month</button></div><div class="summary" id="summary"></div><div class="calendar" id="calendar"></div></div></main><script src="settings-common.js"></script><script>
(()=>{'use strict';const E=id=>document.getElementById(id),months=['January','February','March','April','May','June','July','August','September','October','November','December'];let allTasks=[];
function firstFriday(y){let d=new Date(y,0,1,12);while(d.getDay()!=5)d.setDate(d.getDate()+1);return d}function gw(d){return Math.floor((d-firstFriday(d.getFullYear()))/604800000)+1}function fridays(y,m){let d=new Date(y,m-1,1,12);while(d.getDay()!=5)d.setDate(d.getDate()+1);let a=[];while(d.getMonth()==m-1){a.push(new Date(d));d.setDate(d.getDate()+7)}return a}
async function loadTasks(){const master=await api('/api/pm-master'),names=(master.lines||[]).filter(x=>x.enabled!==false).map(x=>x.name),y=+E('year').value;allTasks=[];for(const line of names){try{const d=await api(`/api/task-management?line=${encodeURIComponent(line)}&year=${y}`);allTasks.push(...(d.tasks||[]).filter(t=>t.isActive!==false))}catch(_){}}render()}
function openWeek(y,m,date){const fs=fridays(y,m),idx=fs.findIndex(x=>x.getDate()===date);api('/api/pm/view',{method:'POST',body:JSON.stringify({year:y,month:m,weekIndex:idx+1})}).then(()=>location='index.html')}
function render(){const y=+E('year').value,m=+E('month').value,first=new Date(y,m-1,1),last=new Date(y,m,0),start=new Date(first);start.setDate(first.getDate()-first.getDay());let html=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join(''),planned=0;for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const inMonth=d.getMonth()===m-1,w=gw(d),isFri=d.getDay()===5&&inMonth;let count=0;if(isFri){count=allTasks.reduce((n,t)=>n+((t.scheduleWeeks||[]).map(Number).includes(w)?1:0),0);planned+=count}html+=`<div class="day ${inMonth?'':'other'} ${isFri?'friday':''}"><div class="num">${d.getDate()}</div>${isFri?`<div class="badge">W${w} • ${count} PM</div><span class="open" data-date="${d.getDate()}">Open week →</span>`:''}</div>`}E('calendar').innerHTML=html;E('summary').textContent=`${months[m-1]} ${y}: ${planned} planned PM occurrences`;E('calendar').querySelectorAll('.open').forEach(x=>x.onclick=()=>openWeek(y,m,+x.dataset.date))}
const n=new Date(),cy=n.getFullYear();E('year').innerHTML=[cy-2,cy-1,cy,cy+1,cy+2].map(y=>`<option>${y}</option>`).join('');E('month').innerHTML=months.map((x,i)=>`<option value="${i+1}">${x}</option>`).join('');E('year').value=cy;E('month').value=n.getMonth()+1;E('year').onchange=loadTasks;E('month').onchange=render;E('today').onclick=()=>{E('year').value=cy;E('month').value=n.getMonth()+1;loadTasks()};loadTasks().catch(e=>alert(e.message))})();
</script><script src="branding-client.js"></script><script src="i18n.js"></script></body></html>
