<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PM Analysis</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f5f8;color:#1f2937}.top{background:#c40000;color:#fff;padding:16px 4%}.top a{float:right;background:#fff;color:#222;padding:9px 13px;border-radius:8px;text-decoration:none;font-weight:bold}.shell{max-width:1250px;margin:20px auto;padding:0 18px}.card{background:#fff;border:1px solid #e2e6eb;border-radius:14px;padding:18px;margin-bottom:16px}.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{font-weight:bold}select,input{display:block;margin-top:6px;padding:10px;border:1px solid #cbd2da;border-radius:8px}button{padding:10px 15px;border:0;border-radius:8px;background:#c40000;color:#fff;font-weight:bold;cursor:pointer}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{background:#f7f8fa;border-radius:10px;padding:15px;text-align:center}.kpi b{font-size:25px;color:#c40000}.bar{height:13px;background:#e5e7eb;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#16a34a}.chart{display:flex;align-items:end;gap:8px;height:180px;padding-top:15px}.col{flex:1;text-align:center;font-size:11px}.stick{background:#16a34a;border-radius:5px 5px 0 0;min-height:2px}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid #d9dee5;padding:8px;text-align:center}.table th{background:#eef1f4}@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}}</style></head><body>
<div class="top"><b style="font-size:23px">PM Analysis & Adherence</b><a href="index.html">← Dashboard</a></div><main class="shell">
<div class="card filters"><label>Year<input id="year" type="number"></label><label>Line<select id="line"><option>ALL</option></select></label><label>Month<select id="selMonth"></select></label><label>Week<select id="selWeek"><option value="0">All Weeks</option><option value="1">W1</option><option value="2">W2</option><option value="3">W3</option><option value="4">W4</option><option value="5">W5</option></select></label><button onclick="load()">Refresh</button><button onclick="location.href='reports.html'">Detailed Reports</button><button onclick="exportAnalysis()">Export Analysis CSV</button><button onclick="window.print()">Print Analysis</button></div>
<div class="card"><h3>Weekly / Monthly / YTD / Annual Adherence</h3><div class="kpis" id="kpis"></div><div class="kpis" style="margin-top:12px" id="periodKpis"></div></div><div class="card"><h3>Monthly PM Adherence — Jan to Dec</h3><div class="chart" id="chart"></div></div>
<div class="card"><h3>Monthly Detail</h3><div style="overflow:auto"><table class="table"><thead><tr><th>Month</th><th>Planned</th><th>Done</th><th>Overdue</th><th>Pending</th><th>Adherence %</th></tr></thead><tbody id="months"></tbody></table></div></div>
<div class="card"><h3>Technician Performance — Done By</h3><div style="overflow:auto"><table class="table"><thead><tr><th>Technician</th><th>Total Done</th><th>% of All Completed PM</th><th>Weekly Done Breakdown</th></tr></thead><tbody id="tech"></tbody></table></div></div>
</main><script>
const token=localStorage.getItem('pmToken');if(!token)location='login.html';async function api(u){let r=await fetch(u,{headers:{Authorization:'Bearer '+token}}),j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}const names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
async function init(){year.value=new Date().getFullYear();selMonth.innerHTML=names.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('');selMonth.value=String(new Date().getMonth()+1);let ls=await api('/api/lines');[...new Set(ls.map(x=>x.line))].forEach(x=>line.add(new Option(x,x)));load()}
async function load(){let d=await api(`/api/management/analysis?year=${year.value}&line=${encodeURIComponent(line.value)}`);let totalDone=d.annual.done;const m=Number(selMonth.value),w=Number(selWeek.value);let r=await api(`/api/annual-plan-report?year=${year.value}&month=${m}&week=${w}&line=${encodeURIComponent(line.value)}&status=ALL`);let planned=r.rows.length,done=r.rows.filter(x=>x.status==='Done').length,overdue=r.rows.filter(x=>x.status==='Overdue').length,pending=r.rows.filter(x=>x.status==='Pending').length,adherence=planned?Math.round(done/planned*1000)/10:0;const label=w?`${names[m-1]} W${w}`:names[m-1];periodKpis.innerHTML=`<div class=kpi><span>${label} Adherence</span><br><b>${adherence}%</b><div>${done}/${planned}</div></div><div class=kpi><span>Planned</span><br><b>${planned}</b></div><div class=kpi><span>Completed</span><br><b>${done}</b></div><div class=kpi><span>Pending / Overdue</span><br><b>${pending+overdue}</b></div>`;kpis.innerHTML=`<div class=kpi><span>YTD Adherence</span><br><b>${d.ytd.adherence}%</b><div>${d.ytd.done}/${d.ytd.planned}</div></div><div class=kpi><span>Annual Adherence</span><br><b>${d.annual.adherence}%</b><div>${d.annual.done}/${d.annual.planned}</div></div><div class=kpi><span>YTD Overdue</span><br><b>${d.ytd.overdue}</b></div><div class=kpi><span>Annual Planned</span><br><b>${d.annual.planned}</b></div>`;months.innerHTML=d.months.map((x,i)=>`<tr><td>${names[i]}</td><td>${x.planned}</td><td>${x.done}</td><td>${x.overdue}</td><td>${x.pending}</td><td><b>${x.adherence}%</b></td></tr>`).join('');chart.innerHTML=d.months.map((x,i)=>`<div class=col><div>${x.adherence}%</div><div class=stick style="height:${Math.max(2,x.adherence*1.35)}px"></div><b>${names[i]}</b></div>`).join('');tech.innerHTML=d.technicians.map(x=>{const wk=Object.entries(x.weeks||{}).sort().map(([k,v])=>`${k}: ${v}`).join(' | ')||'-';return `<tr><td>${x.name}</td><td>${x.total}</td><td>${totalDone?Math.round(x.total/totalDone*1000)/10:0}%</td><td>${wk}</td></tr>`}).join('')||'<tr><td colspan=4>No completed PM yet</td></tr>'}
function csvCell(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
async function exportAnalysis(){
 const d=await api(`/api/management/analysis?year=${year.value}&line=${encodeURIComponent(line.value)}`);
 const out=[['PM ANALYSIS',year.value,line.value],[],['Month','Planned','Done','Overdue','Pending','Adherence %']];
 d.months.forEach((x,i)=>out.push([names[i],x.planned,x.done,x.overdue,x.pending,x.adherence]));
 out.push([],['YTD','Planned',d.ytd.planned,'Done',d.ytd.done,'Adherence %',d.ytd.adherence],['Annual','Planned',d.annual.planned,'Done',d.annual.done,'Adherence %',d.annual.adherence],[],['Technician','Total Done','Weekly Breakdown']);
 d.technicians.forEach(x=>out.push([x.name,x.total,Object.entries(x.weeks||{}).map(([k,v])=>k+': '+v).join(' | ')]));
 const blob=new Blob(['\ufeff'+out.map(row=>row.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`PM_Analysis_${year.value}_${line.value}.csv`;link.click();URL.revokeObjectURL(link.href);
}
init();</script><script src="branding-client.js"></script><script src="i18n.js?v=200"></script></body></html>
