<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PM Reports</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f5f8;color:#1f2937}.top{background:#c40000;color:#fff;padding:16px 3%}.top a{float:right;background:#fff;color:#222;padding:9px 12px;border-radius:8px;text-decoration:none}.shell{max-width:1450px;margin:18px auto;padding:0 15px}.card{background:#fff;border:1px solid #e2e6eb;border-radius:12px;padding:15px;margin-bottom:14px}.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:end}label{font-weight:bold;font-size:13px}select,input{display:block;margin-top:5px;padding:9px;border:1px solid #cbd2da;border-radius:7px}button{padding:10px 13px;border:0;border-radius:7px;background:#c40000;color:#fff;font-weight:bold;cursor:pointer}.gray{background:#374151}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{border:1px solid #d5dae1;padding:6px}.table th{background:#e9edf2}.Done{background:#dcfce7}.Overdue{background:#fee2e2}.Pending{background:#fef3c7}@media print{.top,.filters,.noPrint{display:none}.shell{max-width:none;margin:0}.card{border:0;padding:0}.table{font-size:9px}}
</style></head><body><div class=top><b style="font-size:23px">PM Plan — Full Year / Monthly / Weekly</b><a href="index.html">← PM Plan</a><a href="analysis.html" style="margin-right:8px">Analysis</a></div><main class=shell>
<div class="card filters"><label>Year<input id=year type=number></label><label>Month<select id=month></select></label><label>Report<select id=period><option value=0>All Weeks</option><option value=1>W1</option><option value=2>W2</option><option value=3>W3</option><option value=4>W4</option><option value=5>W5</option></select></label><label>Line<select id=line><option>ALL</option></select></label><label>Status<select id=status><option>ALL</option><option>Done</option><option>Pending</option><option>Overdue</option></select></label><label>Version<select id=version><option value=history>Execution / History (with date)</option><option value=plan>Work Plan (without date)</option></select></label><button onclick=load()>Open Report</button><button class=gray onclick=window.print()>Print</button><button class=gray onclick=exportCsv()>Export Excel/CSV</button></div>
<div class=card><h3 id=title>PM Report</h3><div style="overflow:auto"><table class=table><thead id=head></thead><tbody id=body></tbody></table></div></div></main><script>
const token=localStorage.getItem('pmToken');if(!token)location='login.html';let current=[];async function api(u){let r=await fetch(u,{headers:{Authorization:'Bearer '+token}}),j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}const mn=['January','February','March','April','May','June','July','August','September','October','November','December'];
async function init(){year.value=new Date().getFullYear();month.innerHTML='<option value=0>Full Year (Jan–Dec)</option>'+mn.map((x,i)=>`<option value=${i+1} ${i===new Date().getMonth()?'selected':''}>${x}</option>`).join('');let ls=await api('/api/lines');[...new Set(ls.map(x=>x.line))].forEach(x=>line.add(new Option(x,x)));load()}
function cols(){let base=[['line','Line'],['monthName','Month'],['weekHeader','Week'],['machineNo','Machine No.'],['machineName','Machine'],['part','Part'],['maintenance','PM Task'],['frequency','Frequency'],['status','Status'],['doneBy','Technician']];if(version.value==='history')base.push(['doneDate','Completion Date'],['issue','Issue / Comment']);return base}
async function load(){let u=`/api/annual-plan-report?year=${year.value}&month=${month.value}&week=${period.value}&line=${encodeURIComponent(line.value)}&status=${status.value}`;let d=await api(u);current=d.rows;let c=cols();head.innerHTML='<tr>'+c.map(x=>`<th>${x[1]}</th>`).join('')+'</tr>';body.innerHTML=current.map(r=>`<tr class=${r.status}>${c.map(x=>`<td>${String(r[x[0]]??'')}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=${c.length}>No planned PM tasks found for this selection.</td></tr>`;title.textContent=`${month.value==='0'?'Full Year PM Plan':(period.value==='0'?'Monthly PM Report':'Week '+period.value+' PM Report')} — ${month.value==='0'?'Jan–Dec':mn[month.value-1]} ${year.value} — ${current.length} planned task(s)`}
function exportCsv(){let c=cols(),rows=[c.map(x=>x[1]),...current.map(r=>c.map(x=>r[x[0]]??''))];let csv='\ufeff'+rows.map(a=>a.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let b=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`PM_Report_${year.value}_${month.value}_${period.value}.csv`;a.click();URL.revokeObjectURL(a.href)}init();</script><script src="branding-client.js"></script><script src="i18n.js?v=200"></script></body></html>
