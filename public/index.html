<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart PM Dashboard</title><link rel="stylesheet" href="i18n.css"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#10234b}.hero{background:#c90000;color:#fff;padding:24px 4% 16px}.heroRow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:16px}.brand h1{margin:0;font-size:28px}.brand p{margin:7px 0 0}.logoSlot{min-width:68px;height:48px;border:1px solid #9aa9c9;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.logoSlot img{max-width:100%;max-height:100%}.weekNav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}.periodSelect{background:#fff;color:#10234b;border:0;border-radius:8px;padding:9px 10px;font-weight:700}.periodLabel{font-size:11px;font-weight:700;display:flex;flex-direction:column;gap:3px}.arrow{width:46px;height:46px;border:0;border-radius:12px;background:#a90000;color:#fff;font-size:24px;cursor:pointer}.weekBox{min-width:300px;text-align:center;background:#b50000;border-radius:14px;padding:8px 20px}.weekBox small{display:block;opacity:.8}.weekBox b{font-size:21px}.weekBox .dates{border-top:1px solid #e07070;margin-top:10px;padding-top:7px;font-size:12px}.nav{background:#fff;border-bottom:1px solid #d8dfeb;display:flex;gap:6px;padding:0 4%;overflow:auto}.nav a{padding:18px 20px;text-decoration:none;color:#41516d;font-weight:700;white-space:nowrap;border-bottom:3px solid transparent}.nav a.active{color:#c90000;border-color:#c90000}.wrap{max-width:1450px;margin:28px auto;padding:0 26px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}.kpi{background:#fff;border-radius:18px;padding:26px 28px;border-left:7px solid #c90000;box-shadow:0 4px 14px #17305a10}.kpi:nth-child(2){border-color:#16a34a}.kpi:nth-child(3){border-color:#f59e0b}.kpi:nth-child(4){border-color:#c90000}.kpi:nth-child(5){border-color:#c90000}.kpi span{color:#66748f}.kpi b{display:block;font-size:38px;margin-top:10px;color:#071b45}.panel{background:#fff;border-radius:18px;padding:28px;margin-top:26px}.panel h2{margin:0 0 5px;font-size:28px}.muted{color:#65728b}.sections{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px}.section{border:1px solid #d7dfeb;border-radius:16px;padding:24px;cursor:pointer;transition:.15s}.section:hover{border-color:#2d6cdf;transform:translateY(-1px)}.section h3{font-size:22px;color:#123d91;margin:0 0 8px}.pills{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.pill{padding:5px 11px;border-radius:20px;background:#eef2f7;font-weight:700;font-size:13px}.pending{background:#dbeafe;color:#1454d1}.done{background:#dcfce7;color:#07823d}.deferred{background:#fff0c9;color:#b76400}.error{background:#fff1f1;color:#a40000;padding:15px;border-radius:10px;margin-top:15px}@media(max-width:950px){.heroRow{grid-template-columns:1fr}.weekNav{justify-content:center}.kpis{grid-template-columns:1fr 1fr}.sections{grid-template-columns:1fr 1fr}}@media(max-width:600px){.kpis,.sections{grid-template-columns:1fr}}
</style></head><body>
<header class="hero"><div class="heroRow"><div class="brand"><div class="logoSlot" id="brandLogo">Logo</div><div><h1 id="companyTitle">Smart PM Maintenance</h1><p>Preventive Maintenance System</p></div></div><div class="weekNav"><button class="arrow" onclick="moveWeek(-1)" title="Previous week">◀</button><label class="periodLabel">Year<select id="navYear" class="periodSelect"></select></label><label class="periodLabel">Month<select id="navMonth" class="periodSelect"></select></label><label class="periodLabel">Week<select id="navWeek" class="periodSelect"></select></label><div class="weekBox"><b id="weekTitle">Week - / -</b><div class="dates" id="weekDates">Loading...</div></div><button class="arrow" onclick="moveWeek(1)" title="Next week">▶</button></div><div></div></div></header>
<nav class="nav"><a class="active" href="index.html">Dashboard</a><a href="annual-plans.html">Annual Plan</a><a href="analysis.html">Analysis</a><a href="reports.html">Reports</a><a href="pm-calendar.html">PM Calendar</a><a id="importLink" href="excel-migration.html" style="display:none">Import Excel</a><a id="settingsLink" href="settings.html" style="display:none">Settings</a><a href="#" onclick="logout();return false">Logout</a></nav>
<main class="wrap"><div class="kpis"><div class="kpi"><span>Pending</span><b id="pending">0</b></div><div class="kpi"><span>Completed</span><b id="completed">0</b></div><div class="kpi"><span>Deferred</span><b id="deferred">0</b></div><div class="kpi"><span>Total Planned</span><b id="total">0</b></div><div class="kpi"><span>Adherence</span><b id="adh">0.0%</b></div></div><section class="panel"><h2>Sections</h2><div class="muted">Select a section to view machines and PM tasks for the selected week.</div><div id="err"></div><div class="sections" id="sections"></div></section></main>
<script>
const token=localStorage.pmToken;if(!token)location='login.html';const H={Authorization:'Bearer '+token};let view=null,lines=[];
async function api(u,o={}){o.headers={...(o.headers||{}),...H};if(o.body&&!o.headers['Content-Type'])o.headers['Content-Type']='application/json';const r=await fetch(u,o);const j=await r.json().catch(()=>({}));if(r.status===401){localStorage.clear();location='login.html'}if(!r.ok)throw Error(j.error||r.status);return j}
function fmt(d){return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}function fridays(y,m){let d=new Date(y,m-1,1,12);while(d.getDay()!=5)d.setDate(d.getDate()+1);let a=[];while(d.getMonth()==m-1){a.push(new Date(d));d.setDate(d.getDate()+7)}return a}
function globalWeek(d){const first=new Date(d.getFullYear(),0,1,12);while(first.getDay()!=5)first.setDate(first.getDate()+1);return Math.floor((d-first)/604800000)+1}
function syncPeriodSelectors(){
  const Y = document.getElementById('navYear');
  const M = document.getElementById('navMonth');
  const W = document.getElementById('navWeek');

  // Dashboard can load without the period selectors
  if (!Y || !M || !W || !view || !view.date) return;

  const s = new Date(view.date + 'T12:00:00');
  const y = s.getFullYear();
  const m = s.getMonth() + 1;
  const fs = fridays(y,m);

  let wi = fs.findIndex(x =>
    x.getDate() === s.getDate()
  ) + 1;

  if (wi < 1) wi = 1;

  Y.innerHTML = [y-2,y-1,y,y+1,y+2]
    .map(v => `<option value="${v}">${v}</option>`)
    .join('');
  Y.value = y;

  const mn = [
    'January','February','March','April','May','June',
    'July','August','September','October','November','December'
  ];

  M.innerHTML = mn
    .map((n,i) => `<option value="${i+1}">${n}</option>`)
    .join('');
  M.value = m;

  W.innerHTML = fs
    .map((d,i) => `<option value="${i+1}">W${i+1} (${fmt(d)})</option>`)
    .join('');
  W.value = wi;
}
function showWeek(){
  const s = new Date(view.date + 'T12:00:00');
  const e = new Date(s);
  e.setDate(e.getDate() + 6);

  const weekTitleEl = document.getElementById('weekTitle');
  const weekDatesEl = document.getElementById('weekDates');

  if (weekTitleEl) {
    weekTitleEl.textContent =
      'Week ' + (globalWeek(s) > 0 ? globalWeek(s) : '-') +
      ' / ' + s.getFullYear();
  }

  if (weekDatesEl) {
    weekDatesEl.textContent = fmt(s) + ' - ' + fmt(e);
  }

  syncPeriodSelectors();
}
async function setPeriod(){try{const y=+document.getElementById('navYear').value,m=+document.getElementById('navMonth').value,w=+document.getElementById('navWeek').value||1;await api('/api/pm/view',{method:'POST',body:JSON.stringify({year:y,month:m,weekIndex:w})});await load()}catch(e){document.getElementById('err').innerHTML='<div class=error>'+e.message+'</div>'}}
function refreshWeeks(){const y=+document.getElementById('navYear').value,m=+document.getElementById('navMonth').value,W=document.getElementById('navWeek'),fs=fridays(y,m);W.innerHTML=fs.map((d,i)=>`<option value="${i+1}">W${i+1} (${fmt(d)})</option>`).join('');W.value=1;setPeriod()}
async function moveWeek(delta){try{let d=new Date(view.date+'T12:00:00');d.setDate(d.getDate()+delta*7);const fs=fridays(d.getFullYear(),d.getMonth()+1);let idx=fs.findIndex(x=>x.getDate()===d.getDate());if(idx<0)idx=0;await api('/api/pm/view',{method:'POST',body:JSON.stringify({year:d.getFullYear(),month:d.getMonth()+1,weekIndex:idx+1})});await load()}catch(e){document.getElementById('err').innerHTML='<div class=error>'+e.message+'</div>'}}
async function load(){
  const errEl = document.getElementById('err');
  if (errEl) errEl.innerHTML = '';

  const [me,v,ls] = await Promise.all([
    api('/api/me'),
    api('/api/pm/view'),
    api('/api/lines')
  ]);

  view = v;
  lines = ls;

  showWeek();

  const importLinkEl = document.getElementById('importLink');
  const settingsLinkEl = document.getElementById('settingsLink');

  if (String(me.role).toLowerCase() === 'admin') {
    if (importLinkEl) importLinkEl.style.display = 'block';
    if (settingsLinkEl) settingsLinkEl.style.display = 'block';
  }

  let t = 0;
  let d = 0;

  for (const x of lines) {
    if (x.available !== false) {
      t += Number(x.tasks || 0);
      d += Number(x.done || 0);
    }
  }

  const totalEl = document.getElementById('total');
  const completedEl = document.getElementById('completed');
  const pendingEl = document.getElementById('pending');
  const deferredEl = document.getElementById('deferred');
  const adhEl = document.getElementById('adh');
  const sectionsEl = document.getElementById('sections');

  if (totalEl) totalEl.textContent = t;
  if (completedEl) completedEl.textContent = d;
  if (pendingEl) pendingEl.textContent = Math.max(0, t - d);
  if (deferredEl) deferredEl.textContent = '0';
  if (adhEl) adhEl.textContent = (t ? d / t * 100 : 0).toFixed(1) + '%';

  if (sectionsEl) {
    sectionsEl.innerHTML = lines.map(x => `<div class="section"
      onclick="${x.available!==false ? `location='line.html?line=${encodeURIComponent(x.line)}'` : ''}">
      <h3>${x.line}</h3>
      <div class="muted">View machines and PM tasks</div>
      <div class="pills">
        <span class="pill">Total: ${x.tasks||0}</span>
        <span class="pill pending">Pending: ${Math.max(0,(x.tasks||0)-(x.done||0))}</span>
        <span class="pill done">Completed: ${x.done||0}</span>
        <span class="pill deferred">Deferred: 0</span>
      </div>
    </div>`).join('');
  }
}
async function logout(){try{await api('/api/logout',{method:'POST',body:'{}'})}catch(_){}localStorage.clear();location='login.html'}
document.getElementById('navYear').addEventListener('change',refreshWeeks);document.getElementById('navMonth').addEventListener('change',refreshWeeks);document.getElementById('navWeek').addEventListener('change',setPeriod);load().catch(e=>{
  console.error('DASHBOARD LOAD ERROR:', e);
  const err = document.getElementById('err');
  if (err) err.innerHTML='<div class=error>'+e.message+'</div>';
});
</script><script src="branding-client.js"></script><script src="i18n.js"></script></body></html>
